<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon Budget</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f5fd0">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;background:#f4f6fa;color:#141b2d;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
  @media (prefers-color-scheme:dark){html,body{background:#10131c;color:#e8ecf5}}
  #dem{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:24px;text-align:center}
  #dem .ic{width:64px;height:64px;border-radius:15px}
  #dem .msg{color:#69748c;max-width:320px}
  #dem button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 18px;
    background:#2f5fd0;color:#fff;display:none}
</style>
</head>
<body>
<div id="dem">
  <img class="ic" src="apple-touch-icon.png" alt="">
  <div class="msg" id="dem_msg">Chargement…</div>
  <button id="dem_re" onclick="location.reload()">Réessayer</button>
</div>
<script>
/* ═══════════════════════════════════════════════════════════════════
   Chargeur de « Mon Budget »
   Ce petit fichier ne change jamais. Il va chercher la dernière version
   publiée de l'app sur le serveur, la garde sur l'appareil (pour le
   hors ligne), vérifie qu'elle est intacte, puis l'affiche.
   ═══════════════════════════════════════════════════════════════════ */
(async function(){
  var URL_SRV = "https://mwsakehufnacxeaqxuuc.supabase.co", CLE = "sb_publishable_BaeTZgekUoGhgfiOR1gmcw_oiBR1WWZ";
  var K = "mon-budget-app";                       /* copie locale de l'app */
  /* les deux seuls messages du chargeur, dans la langue de l'appareil */
  var L = (function(){ try{ var l=localStorage.getItem("mon-budget-langue"); if(l) return l; }catch(e){}
    return String(navigator.language||"fr").slice(0,2); })();
  var TR = {
    "Il faut une connexion internet pour le tout premier lancement. Vérifie ton réseau.":
      {en:"An internet connection is needed the very first time. Check your network.",
       es:"Hace falta conexión a internet la primera vez. Comprueba tu red.",
       de:"Beim allerersten Start braucht es eine Internetverbindung. Prüfe dein Netz.",
       ru:"Для самого первого запуска нужен интернет. Проверь подключение."},
    "L'app n'a pas pu s'ouvrir. Réessaie avec du réseau.":
      {en:"The app couldn't open. Try again with a connection.",
       es:"La app no ha podido abrirse. Vuelve a intentarlo con conexión.",
       de:"Die App konnte nicht öffnen. Versuch es mit Netz noch einmal.",
       ru:"Приложение не открылось. Попробуй снова с интернетом."},
    "Chargement…": {en:"Loading…", es:"Cargando…", de:"Wird geladen…", ru:"Загрузка…"},
    "Réessayer": {en:"Try again", es:"Reintentar", de:"Erneut versuchen", ru:"Повторить"}
  };
  var tr = function(t){ return (TR[t] && TR[t][L]) || t; };
  (function(){ var m=document.getElementById("dem_msg"); if(m) m.textContent=tr(m.textContent);
    var r=document.getElementById("dem_re"); if(r) r.textContent=tr(r.textContent.trim()); })();
  var msg = function(t, re){
    t = tr(t);
    document.getElementById("dem_msg").textContent = t;
    document.getElementById("dem_re").style.display = re ? "inline-block" : "none";
  };
  window.__CHARGEUR__ = true;

  function lireLocal(){ try{ return JSON.parse(localStorage.getItem(K)); }catch(e){ return null; } }
  function ecrireLocal(o){ try{ localStorage.setItem(K, JSON.stringify(o)); }catch(e){} }

  async function api(chemin, delai){
    var c = new AbortController(), t = setTimeout(function(){ c.abort(); }, delai);
    try{
      var r = await fetch(URL_SRV + "/rest/v1/" + chemin, {
        headers:{ apikey: CLE, Authorization: "Bearer " + CLE }, cache: "no-store", signal: c.signal });
      if(!r.ok) throw new Error("serveur " + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  }

  async function sha256(txt){
    var b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2,"0"); }).join("");
  }

  async function decompresser(b64){
    var bin = atob(b64), u = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
    var flux = new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(flux).text();
  }

  var local = lireLocal();
  var choisie = local;

  try{
    var v = await api("app_versions?publie=eq.true&select=version,morceaux,empreinte&order=cree_le.desc&limit=1",
                      local ? 3500 : 20000);
    var der = v && v[0];
    if(der && (!local || local.version !== der.version)){
      msg("Mise à jour de l'app…");
      var m = await api("app_morceaux?version=eq." + encodeURIComponent(der.version) +
                        "&select=n,data&order=n.asc", 30000);
      if(m.length !== der.morceaux) throw new Error("morceaux manquants");
      var b64 = m.map(function(x){ return x.data; }).join("");
      if(await sha256(b64) !== der.empreinte) throw new Error("version abîmée");
      await decompresser(b64);                     /* on s'assure qu'elle s'ouvre */
      choisie = {version: der.version, b64: b64};
      ecrireLocal(choisie);
    }
  }catch(e){ /* hors ligne ou souci réseau : on garde la version de l'appareil */ }

  if(!choisie){
    msg("Il faut une connexion internet pour le tout premier lancement. Vérifie ton réseau.", true);
    return;
  }
  try{
    var html = await decompresser(choisie.b64);
    document.open(); document.write(html); document.close();
  }catch(e){
    try{ localStorage.removeItem(K); }catch(_){}
    msg("L'app n'a pas pu s'ouvrir. Réessaie avec du réseau.", true);
  }
})();
</script>
</body>
</html>
